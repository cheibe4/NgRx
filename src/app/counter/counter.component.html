<div class="app-counter-container">
    <div class="app-counter">
        <app-counter-value
        [count]="counter"></app-counter-value>
        <app-counter-button
        (incClicked)="incrementCount()"
        (decClicked)="decrementCount()"
        (resClicked)="resetCount()"
        ></app-counter-button>
    </div>
</div>
